version: 1
project: FIND_YOUR_WAY_PAYOUT_OUTCOME_ASSURANCE
repository: Faadil1/find-your-way-payout-outcomes

claims:
  - claim_id: C1_EXACT_OUTCOME
    statement: "For a ready recipient, the product can deliver an exact destination amount through Stellar Strict Receive within a sender cost bound."
    evidence_class: LIVE_TESTNET_BROWSER
    truth_state: PROVEN
    scenarios: [S1_SUCCESS]
  - claim_id: C2_SAFE_UNREADY_RECIPIENT
    statement: "When a recipient cannot hold the target asset, the product can avoid blind retry and switch to a claimable balance that is later claimed or returned."
    evidence_class: LIVE_TESTNET_BROWSER
    truth_state: PROVEN
    scenarios: [S2_NEGATIVE_NO_TRUST, S3_RECOVERY_CLAIM, S4_RECOVERY_RETURN]
  - claim_id: C3_EXACT_OUTCOME_COST_GUARD
    statement: "When the exact destination amount cannot fit inside the sender cost bound, the product fails closed and does not silently degrade the recipient outcome."
    evidence_class: LIVE_TESTNET_BROWSER
    truth_state: PROVEN
    scenarios: [S5_BOUNDARY_SENDMAX]
  - claim_id: C4_RECONCILE_BEFORE_RETRY
    statement: "When the client loses the submission response, the product enters RECONCILING, blocks duplicate execution, and resolves the original transaction from ledger evidence."
    evidence_class: LIVE_TESTNET_BROWSER
    truth_state: PROVEN
    scenarios: [S6_RECOVERY_RECONCILIATION]

scenarios:
  - scenario_id: S1_SUCCESS
    scenario_type: SUCCESS
    preconditions: "Ready G-account with target-asset trustline and self-seeded Testnet liquidity."
    expected_consequence: "Exact destination amount received."
  - scenario_id: S2_NEGATIVE_NO_TRUST
    scenario_type: NEGATIVE
    preconditions: "Destination G-account exists but lacks target-asset trustline."
    expected_consequence: "Operation fails with no funds moved and op_no_trust evidence."
  - scenario_id: S3_RECOVERY_CLAIM
    scenario_type: RECOVERY
    preconditions: "Claimable balance exists; recipient establishes trustline before deadline."
    expected_consequence: "Recipient claims; outcome transitions CLAIMABLE → USABLE."
  - scenario_id: S4_RECOVERY_RETURN
    scenario_type: RECOVERY
    preconditions: "Recipient does not claim before cutoff; treasury becomes claimant after cutoff."
    expected_consequence: "Treasury reclaims; outcome transitions CLAIMABLE → RETURNED."
  - scenario_id: S5_BOUNDARY_SENDMAX
    scenario_type: BOUNDARY
    preconditions: "Exact destination amount requires more source value than sendMax permits."
    expected_consequence: "Stellar returns sender-cap rejection; no settlement; product reports FAILED_NO_FUNDS_MOVED."
  - scenario_id: S6_RECOVERY_RECONCILIATION
    scenario_type: RECOVERY
    preconditions: "A real payment is submitted but its client success response is intentionally discarded."
    expected_consequence: "Product enters RECONCILING, blocks retry, queries ledger by original hash, confirms one settlement, then resolves outcome."

