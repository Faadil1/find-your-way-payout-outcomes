name: Live UI Proof

on:
  push:
    branches:
      - build/core-outcome-loop
    paths:
      - ".github/workflows/live-ui-proof.yml"
  workflow_dispatch:

concurrency:
  group: live-ui-proof
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  browser-live-core-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser hero flow against live Stellar Testnet
        run: npm run e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-ui-proof
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
